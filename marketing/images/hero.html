<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero - Chinese Trending Data API</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1270px; height: 760px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 40%, #141430 70%, #0f0f23 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  /* Animated gradient overlay */
  body::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 30%, rgba(99,102,241,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(168,85,247,0.06) 0%, transparent 50%);
    pointer-events: none;
  }
  /* Grid pattern */
  body::after {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .container {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 60px;
    width: 100%;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(99,102,241,0.15);
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 100px;
    padding: 8px 20px;
    margin-bottom: 28px;
    color: #a5b4fc; font-size: 13px; font-weight: 500;
    letter-spacing: 0.5px;
    backdrop-filter: blur(10px);
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; }
  h1 {
    font-size: 62px; font-weight: 800; text-align: center;
    background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 50%, #a5b4fc 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.15; margin-bottom: 16px;
    letter-spacing: -1px;
  }
  .tagline {
    font-size: 22px; color: rgba(199,210,254,0.7);
    text-align: center; font-weight: 400;
    margin-bottom: 48px;
    letter-spacing: 0.3px;
  }
  .platform-grid {
    display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
    margin-bottom: 48px;
  }
  .platform-item {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .platform-circle {
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transition: transform 0.2s;
    position: relative;
  }
  .platform-circle::after {
    content: ''; position: absolute; inset: -3px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.1);
  }
  .platform-name {
    font-size: 11px; color: rgba(199,210,254,0.6); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.8px;
  }
  .stats-bar {
    display: flex; gap: 32px; align-items: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 16px 36px;
    backdrop-filter: blur(20px);
  }
  .stat-item {
    display: flex; align-items: center; gap: 10px;
    color: rgba(199,210,254,0.8); font-size: 15px; font-weight: 500;
  }
  .stat-item .icon { font-size: 18px; }
  .stat-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.08); }
  .accent-line {
    width: 80px; height: 3px;
    background: linear-gradient(90deg, #6366f1, #a78bfa);
    border-radius: 4px; margin-bottom: 20px;
  }
  /* Platform circle colors */
  .p-weibo { background: linear-gradient(135deg, #e6162d, #ff4d6d); }
  .p-baidu { background: linear-gradient(135deg, #2932e1, #4a56ff); }
  .p-zhihu { background: linear-gradient(135deg, #0066ff, #3399ff); }
  .p-douyin { background: linear-gradient(135deg, #010101, #333); }
  .p-bilibili { background: linear-gradient(135deg, #00a1d6, #00d4ff); }
  .p-toutiao { background: linear-gradient(135deg, #f04142, #ff6b6b); }
  .p-xiaohongshu { background: linear-gradient(135deg, #ff2442, #ff6b81); }
  .p-tieba { background: linear-gradient(135deg, #44b8ea, #87ceeb); }
</style>
</head>
<body>
  <div class="container">
    <div class="accent-line"></div>
    <div class="badge"><span class="dot"></span> v2.4.0 — Now Available</div>
    <h1>Chinese Trending<br>Data API</h1>
    <p class="tagline">The pulse of China, in one API</p>

    <div class="platform-grid">
      <div class="platform-item">
        <div class="platform-circle p-weibo">W</div>
        <span class="platform-name">Weibo</span>
      </div>
      <div class="platform-item">
        <div class="platform-circle p-baidu">B</div>
        <span class="platform-name">Baidu</span>
      </div>
      <div class="platform-item">
        <div class="platform-circle p-zhihu">Z</div>
        <span class="platform-name">Zhihu</span>
      </div>
      <div class="platform-item">
        <div class="platform-circle p-douyin">DY</div>
        <span class="platform-name">Douyin</span>
      </div>
      <div class="platform-item">
        <div class="platform-circle p-bilibili">BV</div>
        <span class="platform-name">Bilibili</span>
      </div>
      <div class="platform-item">
        <div class="platform-circle p-toutiao">TT</div>
        <span class="platform-name">Toutiao</span>
      </div>
      <div class="platform-item">
        <div class="platform-circle p-xiaohongshu">XS</div>
        <span class="platform-name">Xiaohongshu</span>
      </div>
      <div class="platform-item">
        <div class="platform-circle p-tieba">TB</div>
        <span class="platform-name">Tieba</span>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-item"><span class="icon">📊</span> 3,500+ Trends</div>
      <div class="stat-divider"></div>
      <div class="stat-item"><span class="icon">🌐</span> 8 Platforms</div>
      <div class="stat-divider"></div>
      <div class="stat-item"><span class="icon">🤖</span> LLM-Translated</div>
    </div>
  </div>
</body>
</html>
